<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hallucination Firewall settings</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; color: #1f2328; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    section { background: #fff; border: 1px solid #d0d7de; border-radius: 10px; padding: 16px; margin: 16px 0; }
    section.consent { border-color: #bf8700; background: #fffbea; }
    section.consent.granted { border-color: #1a7f37; background: #f0fff4; }
    label { display: block; margin: 6px 0; }
    label.inline { display: flex; gap: 8px; align-items: center; }
    input[type=text], input[type=password], select { width: 100%; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #d0d7de; background: #fff; cursor: pointer; }
    button.primary { background: #1f883d; color: #fff; border-color: #1a7f37; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .muted { color: #57606a; font-size: 13px; }
    .status { margin-left: 8px; }
    ul { padding-left: 20px; }
    fieldset { border: none; padding: 0; margin: 0; }
    fieldset:disabled { opacity: .55; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="options.js"></script>
</body>
</html>
