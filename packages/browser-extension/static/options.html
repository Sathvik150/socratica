<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socratica settings</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="options">
  <main id="app" aria-busy="true">
    <!-- Skeleton until settings load: the page heading, the privacy notice and the web search card. -->
    <div aria-hidden="true">
      <div class="page-head"><span class="sk-line h-11 w-11 mx-auto rounded-full"></span><span class="sk-line h-10 w-56 mx-auto mt-4"></span><span class="sk-line w-96 max-w-full mx-auto mt-4"></span></div>
      <section class="card sk-card"><span class="sk-title"></span><span class="sk-line w-11/12"></span><span class="sk-line w-4/5"></span><span class="sk-line w-2/3"></span><span class="sk-button"></span></section>
      <section class="card sk-card"><span class="sk-title"></span><span class="sk-line h-14 rounded-xl"></span><span class="sk-line h-14 rounded-xl"></span><span class="sk-line h-14 rounded-xl"></span></section>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
