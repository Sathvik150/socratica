<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hallucination Firewall</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="theme.css">
</head>
<!-- Chrome draws the popup window itself; the content sits in a rounded card so the popup reads as rounded. -->
<body class="popup">
  <div class="card">
    <header>
      <img src="icons/icon-32.png" alt="">
      <h1>Hallucination Firewall</h1>
      <button type="button" id="power" class="switch" role="switch" aria-checked="false"><span class="switch-label">…</span><span class="track" aria-hidden="true"><span class="knob"></span></span></button>
    </header>
    <main id="app" aria-busy="true">
      <!-- Skeleton until settings load: same layout as the "Setup" and "This page" cards. -->
      <section class="sk-card" aria-hidden="true"><span class="sk-title"></span><span class="sk-line w-4/5"></span><span class="sk-line w-3/5"></span></section>
      <section class="sk-card" aria-hidden="true"><span class="sk-title"></span><span class="sk-line w-1/2"></span><span class="sk-button"></span></section>
      <section class="sk-card" aria-hidden="true"><span class="sk-title"></span><span class="sk-line w-2/3"></span><span class="sk-button w-32"></span></section>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
