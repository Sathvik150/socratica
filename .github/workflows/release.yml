name: Release

# Publishes the downloadable zips as a GitHub Release. Three ways to trigger it:
#   1. push a tag like v0.1.0
#   2. push (or merge a PR into) main with "[release]" in the commit message or PR title: the
#      workflow creates the tag v<version from package.json> on that commit. Only main counts,
#      so an unreviewed branch can't publish a release.
#   3. run it manually (Actions tab -> Release -> Run workflow); tick "recreate" to replace an
#      existing release + tag of the same version (e.g. after rewriting history)
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      recreate:
        description: Delete an existing release and tag with the same version first (e.g. after rewriting history)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package
      - name: Work out the tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete the existing release and tag (manual runs with recreate)
        if: github.event_name == 'workflow_dispatch' && inputs.recreate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.tag.outputs.name }}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || echo "nothing to delete"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Hallucination Firewall ${{ steps.tag.outputs.name }}
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Zip | Use it for |
            |---|---|
            | [Chrome extension](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/hallucination-firewall-extension-${{ steps.tag.outputs.name }}.zip) | Annotate answers on chatgpt.com |
            | [Full Agent Skill](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/hallucination-firewall-skill-${{ steps.tag.outputs.name }}.zip) | Skills upload in Claude or another Agent Skills host; bundled validators |
            | [Instruction-only Agent Skill](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/hallucination-firewall-skill-instructions-${{ steps.tag.outputs.name }}.zip) | Skills upload without scripts; manual quote checks |
            | [Full ChatGPT plugin](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/hallucination-firewall-plugin-${{ steps.tag.outputs.name }}.zip) | Plugins → New Plugin; manifest, skill, and validators |
            | [Instruction-only ChatGPT plugin](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/hallucination-firewall-plugin-instructions-${{ steps.tag.outputs.name }}.zip) | Plugin upload without scripts; manual quote checks |
            | [Standalone CLI](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/hf-verify-cli-${{ steps.tag.outputs.name }}.zip) | Local verification with Node 20+, including Ollama / LM Studio |

            ## Install the ChatGPT plugin

            1. Download the full ChatGPT plugin ZIP above and keep it zipped.
            2. Open **Plugins → New Plugin**, upload the ZIP, and choose **Add plugin**.
            3. Start a new chat, select the plugin, and ask: **Fact-check this answer against these sources.** Attach or paste the answer and source documents.
            4. For a variant without scripts, upload the instruction-only plugin ZIP instead. It checks quotes manually and does not machine-validate them.

            Plugin upload has been confirmed; fact-checking behavior after installation still needs verification. Install one variant at a time because both use the same plugin and skill names.

            ## Install the standalone skill

            - **Claude:** enable code execution, open **Settings → Skills → Upload skill**, and select the full Agent Skill ZIP without extracting it.
            - **Claude Code:** unzip the full Agent Skill ZIP into `~/.claude/skills/` (all projects) or `.claude/skills/` (one project).
            - **Other Skills uploaders:** use an Agent Skill ZIP. Use a plugin ZIP for **Plugins → New Plugin**; the standalone skill does not include a plugin manifest.
            - Choose the instruction-only skill ZIP if you need the variant without scripts. Quotes are checked manually. Install only one skill variant at a time.

            ## Install the Chrome extension or CLI

            - **Chrome:** unzip the extension ZIP, open `chrome://extensions`, enable **Developer mode**, select **Load unpacked**, and choose the extracted folder containing `manifest.json`. Accept the privacy notice and configure the judge/evidence sources in Settings.
            - **CLI:** unzip the CLI ZIP, open the `hf-verify` folder, then run `node hf-verify.mjs verify --answer a.txt --evidence docs/` with Node 20+.

            See the [README](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.name }}/README.md), [skill and plugin guide](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.name }}/docs/skill.md), and [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.name }}/CHANGELOG.md). Plugin layout follows [OpenAI's packaging guide](https://developers.openai.com/plugins/build/plugins).
