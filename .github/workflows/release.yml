name: Release

# Publishes the downloadable zips as a GitHub Release. Three ways to trigger it:
#   1. push a tag like v0.1.0
#   2. push a commit whose message contains "[release]": the workflow creates the
#      tag v<version from package.json> on that commit
#   3. run it manually (Actions tab -> Release -> Run workflow); tick "recreate" to replace an
#      existing release + tag of the same version (e.g. after rewriting history)
on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:
    inputs:
      recreate:
        description: Delete an existing release and tag with the same version first (e.g. after rewriting history)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package
      - name: Work out the tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete the existing release and tag (manual runs with recreate)
        if: github.event_name == 'workflow_dispatch' && inputs.recreate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.tag.outputs.name }}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || echo "nothing to delete"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Hallucination Firewall ${{ steps.tag.outputs.name }}
          files: release/*.zip
          generate_release_notes: true
          body: |
            ## Downloads

            | Zip | Use it for |
            |---|---|
            | `hallucination-firewall-extension-*.zip` | Chrome: unzip, `chrome://extensions` → Developer mode → **Load unpacked** |
            | `hallucination-firewall-skill-*.zip` | Upload as a skill in Claude / ChatGPT, or unzip into `~/.claude/skills/` |
            | `hf-verify-cli-*.zip` | Local use: `node hf-verify.mjs verify --answer a.txt --evidence docs/` (works with Ollama / LM Studio) |

            See the [README](https://github.com/${{ github.repository }}#readme) and [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md).
